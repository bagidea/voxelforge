[package]
name = "voxelforge-server"
version = "0.1.0"
edition = "2021"
description = "Authoritative Rust server — owns world state, validates changes, streams chunks. No Bevy."

[[bin]]
name = "voxelforge-server"
path = "src/main.rs"

[dependencies]
voxelforge-sim = { path = "../sim" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
