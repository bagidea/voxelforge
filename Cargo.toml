[workspace]
members = ["sim", "server", "client"]
resolver = "2"

# Workspace-wide release profile — inherited by all members. This is the Steam
# ship profile: fat LTO across the whole graph + a single codegen unit buys the
# frame time, `strip` drops debuginfo so the shipped exe isn't a few hundred MB.
# NO `panic = "abort"` — parts of Bevy still rely on unwinding.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "debuginfo"

# Keep dependencies fast even in debug builds so Bevy isn't unusably slow.
[profile.dev.package."*"]
opt-level = 3

# Measurement profile (perf probe). Same opt-level as the ship profile — CPU-side
# frame time has to be real — but WITHOUT fat LTO/1 codegen unit, which buy a few
# percent at the cost of a ~20 min link on every probe rebuild. The probe is
# GPU-post-bound; the LTO delta is far below the effects being measured.
[profile.perf]
inherits = "release"
lto = false
codegen-units = 16
